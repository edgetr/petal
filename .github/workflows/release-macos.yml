# Push a tag like macos-v2.0.2 (matching macos/VERSION) to publish Petal.
# Builds Petal.app, zips it, writes latest-macos.json (what Petal's updater and get.sh read), and creates the GitHub
# Release with macos/notes/<version>.md as its text, marked as the latest. Then it deletes every release older than
# the newest three (their git tags stay). Uses only the workflow's own GITHUB_TOKEN.
#
# Petal finds its releases by the macos-v tag and the latest-macos.json asset: neither name may change.
name: Release macOS

on:
  push:
    tags: ["macos-v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.MACOS_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#macos-v}"
          m="$(cat macos/VERSION)"
          [ "$v" = "$m" ] || { echo "Tag $v doesn't match macos/VERSION $m"; exit 1; }
          # The site's Download for Mac button (/download/mac) must point at this release.
          grep -q "macos-v$v/Petal-$v-macos.zip" site/vercel.json || { echo "site/vercel.json's /download/mac doesn't point at $v"; exit 1; }

      # Petal has no Apple Developer ID. With a self-made signing certificate stored in the MACOS_SIGNING_P12 secret
      # (base64 .p12, password in MACOS_SIGNING_PASSWORD), every release carries the same signature, so macOS keeps
      # the permissions people gave Petal (Accessibility, Screen Recording) across updates. Without it, ad hoc.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        if: env.HAS_SIGNING == 'true'
        run: |
          keychain="$RUNNER_TEMP/petal.keychain-db"
          security create-keychain -p petal "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p petal "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/petal.p12"
          security import "$RUNNER_TEMP/petal.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k petal "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Self-made, so macOS lists it as untrusted; codesign signs with it all the same.
          identity="$(security find-identity "$keychain" | awk '/\)/ {print $2; exit}')"
          echo "PETAL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: macos/build.sh

      # Every installed Petal, and get.sh, install a download only when it's signed with Petal's own certificate
      # (UpdateTrust.swift, the same words). A build they would refuse is never published: without the certificate
      # the build is ad hoc, and this stops the release here.
      - name: Check it's signed as installed Petals expect
        env:
          MAKER: 'identifier "tech.edgetr.petal" and certificate root = H"29feb33bdddb5686cbc597ca9706b0b8a6f3b36d"'
        run: codesign --verify --deep --strict -R="$MAKER" macos/build/Petal.app

      - name: Package
        run: |
          v="${GITHUB_REF_NAME#macos-v}"
          mkdir -p dist
          ditto -c -k --keepParent macos/build/Petal.app "dist/Petal-$v-macos.zip"
          sha="$(shasum -a 256 "dist/Petal-$v-macos.zip" | cut -d' ' -f1)"
          cat > dist/latest-macos.json <<JSON
          {
            "version": "$v",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Petal-$v-macos.zip",
            "sha256": "$sha"
          }
          JSON
          cat dist/latest-macos.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#macos-v}"
          # The release's text is What's New in the app: macos/notes/<version>.md when there is one.
          if [ -f "macos/notes/$v.md" ]; then notes=(--notes-file "macos/notes/$v.md"); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "dist/Petal-$v-macos.zip" dist/latest-macos.json \
            --title "Petal for macOS $v" "${notes[@]}" --latest

      # Only the newest three releases are kept, by creation date. A deleted release's git tag stays: `petal personal`
      # takes a version's source from its tag.
      - name: Keep the newest three releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          old="$(gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("macos-v"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName')"
          for tag in $old; do
            echo "Deleting the release $tag (its tag stays)"
            gh release delete "$tag" --yes
          done
