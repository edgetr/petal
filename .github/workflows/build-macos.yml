# Builds Petal on every pull request that touches the app, with the same runner and compiler as a release, so a tag
# never meets a compiler error first. Nothing is signed with Petal's certificate or published.
name: Build macOS

on:
  pull_request:
    paths: ["macos/**", "brand/macos/**", ".github/workflows/build-macos.yml", ".github/workflows/release-macos.yml"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PETAL_SIGN_IDENTITY: "-"
        run: macos/build.sh
