# Push a tag like v3.2.0 (matching plugin/manifest.json) to publish a release.
# Builds the Linux package, writes latest.json (what `petal update` reads),
# and creates the GitHub Release. Uses only the workflow's own GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          m="$(python3 -c 'import json; print(json.load(open("plugin/manifest.json"))["version"])')"
          [ "$v" = "$m" ] || { echo "Tag $v doesn't match manifest version $m"; exit 1; }

      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist/petal
          cp -r plugin bin defaults install.sh uninstall.sh get.sh LICENSE README.md dist/petal/
          tar -C dist -czf "dist/Petal-$v-linux.tar.gz" petal
          cp "dist/Petal-$v-linux.tar.gz" dist/Petal-linux.tar.gz
          sha="$(sha256sum "dist/Petal-$v-linux.tar.gz" | cut -d' ' -f1)"
          cat > dist/latest.json <<JSON
          {
            "version": "$v",
            "linux": { "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Petal-$v-linux.tar.gz", "sha256": "$sha" },
            "macos": null,
            "windows": null
          }
          JSON
          cat dist/latest.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Petal-$v-linux.tar.gz" dist/Petal-linux.tar.gz dist/latest.json \
            --title "Petal $v" --generate-notes
